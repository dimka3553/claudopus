name: Check
# Runs every test on each push of main, so after each release, which never waits for it, and on each pull request. A release
# runner set to wait for GitHub (GITHUB_CHECKS in a .release or release.local) can still start it on a commit, given as `sha`
run-name: ${{ inputs.sha && format('Release check {0}', inputs.sha) || github.event.pull_request.title || github.event.head_commit.message }}
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: The commit a release is to make main
        required: true
# What runs here, a branch's tests among it, only reads the repo
permissions:
  contents: read
jobs:
  # Every check on Linux, a Mac and Windows: Claudopus runs on all three. On Windows every step runs in Git's bash, as Claude
  # Code's own commands do there
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - name: The commit checked is the one the release asked for
        if: inputs.sha
        env:
          SHA: ${{ inputs.sha }}
        run: |
          [[ $SHA =~ ^[0-9a-f]{40}$ ]] && test "$(git rev-parse HEAD)" = "$SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The shipped hooks file matches its parts
        run: node src/claudopus/build.mjs --check
      - name: The manifests are valid JSON
        run: |
          for f in .claude-plugin/marketplace.json mods/claudopus/.claude-plugin/plugin.json site/version.json; do
            jq empty "$f"
          done
      - name: The site's version matches the plugin's
        run: |
          test "$(jq -r .version mods/claudopus/.claude-plugin/plugin.json)" = "$(jq -r .version site/version.json)"
      - name: The committed notification apps match their recorded checksums
        run: sh mods/claudopus/notifier/check.sh
      - name: ImageMagick, which stands in for macOS's sips on Linux
        if: runner.os == 'Linux'
        run: command -v convert || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
      # Every test, as src/claudopus/test-all.sh runs them, the shell tests beside the mod's, as most of their time is waiting: the admin runner's
      # gate holds (a keychain of its own on a Mac, bin/keyring's files on Linux), the keeper goes on with a chat's work, the watcher
      # brings Claudopus back in a chat where Claude switched it off, and what stands in on Linux for a Mac's own tools works. The
      # mod's tests run in Claude Code's own test kit, from its public npm package, pinned to a version that passes them all. A piece
      # of work runs them before its release with the desktop app's engine
      # Claude Code's public engine from npm, pinned to a version that passes every test: the mod's tests run in its test kit, and the
      # installers and the load check use it as a person's Claude Code
      - name: Claude Code from npm
        run: npm install -g --silent @anthropic-ai/claude-code@2.1.325 && claude --version
      # The one-line installer for Windows, in Windows PowerShell and PowerShell 7
      - name: The Windows installer works
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File mods/claudopus/bin/install.test.ps1
          if ($LASTEXITCODE) { exit 1 }
      - name: The shell tests and the mod's tests pass
        run: |
          o=$(mktemp -d); r=0 later=
          # (on Windows one after another, after the mod's tests: every process starts slowly there, and beside the mod's tests the
          # shell tests' few seconds of waiting for the watcher or GitHub's checks ran out)
          for t in admin revive linux run-it pane-file catch-up tidy allow-tool; do
            if [ "$RUNNER_OS" = Windows ]; then later="$later $t"; else { bash mods/claudopus/bin/$t.test.sh >"$o/$t" 2>&1 && echo 0 || echo 1; } >"$o/$t.rc" & fi
          done
          claude plugin test mods/claudopus || r=1
          wait
          # The installer's and the load check's own Claude Codes run after the mod's tests, whose time limits they would eat into
          for t in $later install load; do { bash mods/claudopus/bin/$t.test.sh >"$o/$t" 2>&1 && echo 0 || echo 1; } >"$o/$t.rc"; done
          for t in admin revive linux run-it pane-file catch-up tidy allow-tool install load; do
            echo "::group::$t.test.sh"; cat "$o/$t"; echo "::endgroup::"
            [ "$(cat "$o/$t.rc")" = 0 ] || { echo "::error::$t.test.sh failed"; r=1; }
          done
          exit $r
