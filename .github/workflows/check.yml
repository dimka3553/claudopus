name: Check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # Every check on Linux and on a Mac: Claudopus runs on both
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The shipped hooks file matches its parts
        run: node src/claudopus/build.mjs --check
      - name: The manifests are valid JSON
        run: |
          for f in .claude-plugin/marketplace.json mods/claudopus/.claude-plugin/plugin.json site/version.json; do
            jq empty "$f"
          done
      - name: The site's version matches the plugin's
        run: |
          test "$(jq -r .version mods/claudopus/.claude-plugin/plugin.json)" = "$(jq -r .version site/version.json)"
      - name: The committed notification apps match their recorded checksums
        run: sh mods/claudopus/notifier/check.sh
      - name: ImageMagick, which stands in for macOS's sips on Linux
        if: runner.os == 'Linux'
        run: command -v convert || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
      - name: The admin runner's gate holds (a keychain of its own on a Mac, bin/keyring's files on Linux)
        run: bash mods/claudopus/bin/admin.test.sh
      - name: The keeper goes on with a chat's work
        run: bash mods/claudopus/bin/keep.test.sh
      - name: What stands in on Linux for a Mac's own tools works
        run: bash mods/claudopus/bin/linux.test.sh
      # Every test, as the release runs them: Claude Code's own test kit, from its public npm package, pinned to a version that
      # passes them all. The release runs them again with the desktop app's engine
      - name: The mod's tests pass
        run: npx --yes @anthropic-ai/claude-code@2.1.325 plugin test mods/claudopus
