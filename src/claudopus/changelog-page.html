<style>
/* ---- Claudopus design system: tokens and base, as on the home page ---- */
:root{
  color-scheme:dark;
  /* one cell is the unit of everything: the octopus, the corners, the spacing */
  --cell:4px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px;--s8:32px;--s12:48px;--s16:64px;--s24:96px;--s32:128px;
  /* faces */
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  /* type scale */
  --t-note:13px;--t-small:15px;--t-body:18px;--t-lead:22px;--t-title:22px;
  --t-head:clamp(30px,5vw,44px);--t-display:clamp(40px,7.2vw,68px);
  /* the page, dark */
  --ground:#111112;--raised:#1C1C1F;--line:#2F2F35;
  --ink:#F3F2EF;--soft:#A6A6AB;--faint:#6A6A70;
  /* purple is the octopus and the one thing to press */
  --purple:#8A63F0;--purple-lift:#A58BFA;--purple-deep:#6A45D8;--purple-ink:#A58BFA;--on-purple:#111112;
  /* green only says finished, coral only says trouble */
  --green:#4EBA65;--green-ink:#5FC553;--coral:#FF6B4A;--coral-ink:#FF8163;
  /* screens show the app, which is dark, so they stay dark in both themes */
  --screen:#0A0A0B;--screen-raised:#252527;--screen-line:#34343A;--screen-key:#3A3A41;
  --screen-ink:#F3F2EF;--screen-soft:#A6A6AB;--screen-purple:#A58BFA;--screen-green:#5FC553;
  /* motion: quarter-second beats, moved in steps */
  --beat:250ms;
  /* measures */
  --page:1120px;--text:640px;--rail:96px;--gutter:24px;
}
@media (prefers-color-scheme:light){:root{
  color-scheme:light;
  --ground:#FAF9F5;--raised:#EFEDE5;--line:#D9D6CB;
  --ink:#18181A;--soft:#5C5C63;--faint:#9A9AA2;
  --purple-ink:#6A45D8;--green-ink:#2B7A3D;--coral-ink:#C2401F;
}}
@media (max-width:640px){:root{--t-body:17px;--t-lead:19px;--t-title:20px;--gutter:16px}}

/* ---- base ---- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:var(--s6)}
body{margin:0;background:var(--ground);color:var(--ink);font:400 var(--t-body)/1.55 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
img,video,svg{display:block;max-width:100%}
h1{font:700 var(--t-display)/1.04 var(--sans);letter-spacing:-.035em;text-wrap:balance}
h2{font:700 var(--t-head)/1.1 var(--sans);letter-spacing:-.03em;text-wrap:balance}
h3{font:700 var(--t-title)/1.25 var(--sans);letter-spacing:-.01em}
.lead{font-size:var(--t-lead);line-height:1.45;color:var(--soft);max-width:var(--text);text-wrap:pretty}
.small{font-size:var(--t-small);line-height:1.5}
.note{font:400 var(--t-note)/1.4 var(--mono);color:var(--soft)}
.soft{color:var(--soft)}
.name{color:var(--purple-ink)}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--purple);text-decoration-thickness:2px;text-underline-offset:4px}
a:hover{color:var(--purple-ink)}
:focus-visible{outline:2px solid var(--purple-ink);outline-offset:3px}
code,kbd{font:400 .88em/1.4 var(--mono)}
p code,li code{background:var(--raised);padding:0 var(--s1);white-space:nowrap}
code.long{white-space:normal;overflow-wrap:anywhere}
::selection{background:var(--purple);color:var(--on-purple)}

/* ---- this page ---- */
.wrap{max-width:calc(var(--text) + 2*var(--gutter));margin:0 auto;padding:0 var(--gutter)}
.top{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);padding:var(--s4) 0}
.brand{display:flex;align-items:center;gap:var(--s3);font-weight:700;text-decoration:none}
.top nav a{text-decoration:none;color:var(--soft);font-size:var(--t-small);padding:var(--s3) 0}
.top nav a:hover{color:var(--ink)}
.head{padding:var(--s12) 0 var(--s8)}
.head .lead{margin-top:var(--s3)}
section{padding:var(--s6) 0;border-top:var(--cell) solid transparent;background:repeating-linear-gradient(90deg,var(--line) 0 var(--cell),transparent var(--cell) var(--s3)) top/100% var(--cell) no-repeat}
section h2{font-size:var(--t-title)}
section .note{margin:var(--s1) 0 var(--s3)}
section li{position:relative;padding-left:var(--s6);margin-top:var(--s2)}
section li::before{content:"";position:absolute;left:0;top:.6em;width:var(--s2);height:var(--s2);background:var(--purple)}
.foot{padding:var(--s12) 0 var(--s16);color:var(--soft);font-size:var(--t-small)}
</style>
</head>
